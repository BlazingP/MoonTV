<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blazing TV</title>
<style>
  :root { --bg: #0b0b0d; --card: #17171b; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a00; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: radial-gradient(circle at 30% 20%, #2a1405 0, var(--bg) 55%);
         color: var(--text); font-family: system-ui, sans-serif; }
  main { width: min(640px, 90vw); padding: 40px 44px; border-radius: 20px; background: var(--card);
         box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  h1 { margin: 0 0 6px; font-size: 30px; }
  h1 span { color: var(--accent); }
  p { margin: 6px 0; color: var(--muted); font-size: 18px; line-height: 1.5; word-break: break-all; }
  code { color: var(--text); }
  .row { display: flex; gap: 14px; margin-top: 26px; }
  button, input { font: inherit; font-size: 20px; border-radius: 12px; border: 2px solid #333; }
  button { padding: 12px 26px; background: #26262b; color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 700; }
  input { flex: 1; padding: 12px 16px; background: #0f0f12; color: var(--text); }
</style>
</head>
<body>
<main>
  <h1><span>Blazing</span> TV 连不上服务器</h1>
  <p>服务器：<code id="server"></code></p>
  <p id="reason"></p>
  <p>请确认放 MoonTV 的那台电脑已开机，并和电视在同一个网络里。</p>
  <div class="row">
    <button class="primary" id="retry">重试</button>
  </div>
  <div class="row">
    <input id="addr" type="url" placeholder="http://192.168.0.200:3000">
    <button id="save">改用这个地址</button>
  </div>
</main>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var server = params.get('server') || '';
    document.getElementById('server').textContent = server;
    document.getElementById('reason').textContent = params.get('reason') ? '原因：' + params.get('reason') : '';
    document.getElementById('addr').value = server;
    document.getElementById('retry').addEventListener('click', function () {
      if (window.TvBridge) window.TvBridge.retry(); else location.href = server;
    });
    function save() {
      if (window.TvBridge) window.TvBridge.setServer(document.getElementById('addr').value);
    }
    document.getElementById('save').addEventListener('click', save);
    // 输入法里按“前往/完成”直接保存
    document.getElementById('addr').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') save();
    });
  })();
</script>
</body>
</html>
