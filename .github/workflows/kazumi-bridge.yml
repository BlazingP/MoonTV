name: Kazumi bridge checks

on:
  pull_request:
    branches: [Brunch-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: corepack enable && corepack prepare pnpm@10.12.4 --activate
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: python -m pip install -r services/kazumi-bridge/requirements.txt
      - run: python -m unittest discover -s services/kazumi-bridge/tests -v
      - run: node --test scripts/test-kazumi-proxy.cjs scripts/test-kazumi-catalog.cjs
      - run: pnpm gen:runtime && pnpm typecheck
      - run: pnpm exec next lint --file src/lib/kazumi.ts --file src/lib/kazumi-catalog.ts --file src/lib/downstream.ts --file 'src/app/api/kazumi/[...path]/route.ts' --file src/app/api/kazumi/catalog/route.ts --file src/app/api/search/route.ts --file src/app/kazumi/page.tsx --file src/components/Sidebar.tsx --file src/components/MobileBottomNav.tsx
      - run: node scripts/setup-kazumi.mjs http://localhost:3000
      - run: docker compose --env-file .env.kazumi -f docker-compose.yml -f docker-compose.kazumi.yml config --quiet
